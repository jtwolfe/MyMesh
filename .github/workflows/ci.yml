# MyMesh CI — Linux build
#
# Builds mymesh linux binaries on push to rework/unify, tags, and pull requests.
#
name: CI

on:
  workflow_dispatch:
  push:
    branches: [rework/unify]
    tags: ['v*']
  pull_request:
    branches: [rework/unify]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p mymesh-cli

      - name: Smoke CLI
        run: |
          ./target/release/mymesh --help
          ./target/release/mymesh demo pair

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymesh-linux-x86_64
          path: target/release/mymesh
          if-no-files-found: error
