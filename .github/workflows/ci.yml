# MyMesh CI — Linux build
#
# Builds mymesh linux binaries on push to rework/unify, tags, and pull requests.
#
name: CI

on:
  workflow_dispatch:
  push:
    branches: [rework/unify]
    tags: ['v*']
  pull_request:
    branches: [rework/unify]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p mymesh-cli

      - name: Smoke CLI
        run: |
          ./target/release/mymesh --help
          ./target/release/mymesh demo pair

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymesh-linux-x86_64
          path: target/release/mymesh
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: mymesh-linux-x86_64
          path: artifacts

      - name: Prepare release assets
        run: |
          mv artifacts/mymesh mymesh-linux-x86_64
          chmod +x mymesh-linux-x86_64
          sha256sum mymesh-linux-x86_64 > mymesh-linux-x86_64.sha256

      - name: Determine prerelease status
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mymesh-linux-x86_64
            mymesh-linux-x86_64.sha256
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
