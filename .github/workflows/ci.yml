# MyMesh CI — Linux build
#
# DISABLED FOR NOW.
# - Does not run on push/PR.
# - Job is gated with `if: false`.
# - When ready: remove `if: false` and uncomment the `push` / `pull_request` triggers.
#
name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    # Temporarily disabled — enable when ready to run CI.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p mymesh-cli

      - name: Smoke CLI
        run: |
          ./target/release/mymesh --help
          ./target/release/mymesh demo pair

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymesh-linux-x86_64
          path: target/release/mymesh
          if-no-files-found: error
